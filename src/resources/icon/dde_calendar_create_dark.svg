<?xml version="1.0" encoding="UTF-8"?>
<!--
    深色主题的「新建」加号：几何与 dde_calendar_create_light.svg 完全一致
    （16x16 画布、1px 描边、圆头、墨迹 14x14），只把描边换成白色
    —— CPushButton 高亮态时也会用到这份。
-->
<svg width="16px" height="16px" viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round">
        <polyline points="8 1.5 8 14.5"/>
        <polyline points="1.5 8 14.5 8"/>
    </g>
</svg>
