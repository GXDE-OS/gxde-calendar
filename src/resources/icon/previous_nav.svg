<?xml version="1.0" encoding="UTF-8"?>
<!--
    「上一页」箭头：45 度圆头折线，描边 1（渲染出来就是 1px 的细边），
    放到 16x16 画布正中。折线两端各占 6px（横向 6、纵向 ±6），含描边的外接盒约 6.7x12.7，
    即画布内缩约 1.7px；图标外边到 36px 按钮边缘还有 10 + 1.7 ≈ 12px，远大于 4px。
    这个尺寸是照 dde-calendar 主界面侧栏那个箭头量的（截图 2x 下 14x25 设备像素，
    折合逻辑 7x12.5，描边 1px）；描边颜色沿用 #303030。
    深色主题见 previous_nav_dark.svg。
-->
<svg width="16px" height="16px" viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <polyline points="11 2 5 8 11 14" fill="none" stroke="#303030" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
